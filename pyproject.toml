[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ragtrust"
version = "0.1.0"
description = "Golden-guided synthetic RAG evaluation dataset generation and validation"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "streamlit==1.64.0",
  "pydantic==2.13.5",
  "sqlalchemy==2.0.54",
  "pypdf==6.19.0",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "python-dotenv==1.2.3",
  "azure-ai-projects==2.7.0",
  "azure-identity==1.25.3",
  "azure-monitor-opentelemetry==1.8.10",
  "openai==3.16.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
ragas = ["ragas==0.4.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
